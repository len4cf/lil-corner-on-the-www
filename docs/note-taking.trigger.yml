# ---------------------------------------------------------------------------
# COPY THIS FILE INTO THE **len4cf/note-taking** REPO at:
#     .github/workflows/trigger-corner.yml
#
# It runs whenever Obsidian (via the obsidian-git plugin) pushes notes, and
# pings this site's repo so it re-fetches and rebuilds.
#
# Required secret in the note-taking repo:
#   DISPATCH_TOKEN — a fine-grained PAT scoped to len4cf/lil-corner-on-the-www
#                    with "Contents: Read and write" permission.
# ---------------------------------------------------------------------------
name: Trigger site rebuild

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Notify lil-corner-on-the-www 
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/len4cf/lil-corner-on-the-www/dispatches \
            -d '{"event_type":"notes-updated"}'
