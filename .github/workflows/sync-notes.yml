name: Sync notes

# Pulls published notes from the note repos, post-processes them, and commits
# the result back to this repo. Triggered when the note repo pushes (via a
# repository_dispatch it sends), on a daily safety-net schedule, or manually.
on:
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily, as a fallback

# Which repositories to fetch published notes from. Comma-separated owner/repo.
env:
  REPOS: len4cf/note-taking

# Allow the workflow to push the regenerated content back to the repo.
permissions:
  contents: write

concurrency:
  group: sync-notes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & process notes
        env:
          # Fine-grained PAT with "Contents: read" on the private note repo(s).
          NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
        run: npm run fetch

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/notes public/notes
          if git diff --cached --quiet; then
            echo "No note changes to commit."
          else
            git commit -m "chore(notes): sync published notes [skip ci]"
            git push
          fi
