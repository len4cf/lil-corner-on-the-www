name: Sync notes

on:
  repository_dispatch:
    types: [notes-updated]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' 

# qual repositorio fetch from
env:
  REPOS: len4cf/note-taking

permissions:
  contents: write

concurrency:
  group: sync-notes
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & process notes
        env:
          NOTES_TOKEN: ${{ secrets.NOTES_TOKEN }}
        run: npm run fetch

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/notes public/notes
          if git diff --cached --quiet; then
            echo "No note changes to commit."
          else
            git commit -m "fetchando notas do note-taking"
            git push
          fi
